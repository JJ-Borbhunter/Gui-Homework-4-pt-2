<!DOCTYPE html>
<html>
<head>
    <!-- Template head -->
    <title>Dynamic Multiplication Table</title>
    <meta charset="utf-8">
    <link href="mult.css" rel="stylesheet">
    <link href="jquery-ui.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Loads of the Jquery library files -->
    <script src="jquery-4.0.0.js"></script>
    <script src="jquery.validate.js"></script>
    <script src="jquery-ui.js"></script>

    <!-- load of the page's javascript -->
    <script src="mult.js" defer></script>
</head>
<body>
    <div id="body-section">
        <!-- Area for the submission of parameters -->
        <form id="mult-form">

        <!-- Fieldset for the in-line title -->
        <fieldset>
            <!-- area title bar -->
            <legend>Parameters</legend>

            <!-- 
            The inputs do not any longer need regex patterns or 
            type specification as JQuery handles that in the JS.
            -->

            <!-- minimum row value input -->
            <label for="min-x">Minimum row value:</label>
            <input id="min-x" name="min_x" value="0">
            <div class="slider" id="min-x-s"></div>

            <!-- maximum row value input -->
            <label for="max-x">Maximum row value:</label>
            <input id="max-x" name="max_x" value="0">
            <div class="slider" id="max-x-s"></div>


            <!-- minimum column value input -->
            <label for="min-y">Minimum column value:</label>
            <input id="min-y" name="min_y" value="0">
            <div class="slider" id="min-y-s"></div>


            <!-- maximum column value input -->
            <label for="max-y">Maximum column value:</label>
            <input id="max-y" name="max_y" value="0">
            <div class="slider" id="max-y-s"></div>


            <!-- Submit button -->
            <input type="submit" value="Submit" id="submit">
        </fieldset>
        </form>

        <!-- empty div for holding the resulting table -->
        <div id="table-container">
        </div>
    </div>

    <!-- Page-size section to hold the tabbed interface -->
    <div id="tabs-section">
        <!-- Explanatory note -->
        <p>
            Note:  Hold control/command and click to select multiple tabs, 
            and hit delete or backspace to delete.
        </p>
        <!-- empty tab container for jquery -->
        <div id="tabs">
            <ul></ul>
        </div>
    </div>
</body>
</html>
